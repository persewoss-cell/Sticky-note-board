<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보드판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="board-body">
  <header class="board-top-bar">
    <h1 id="boardTitle">보드판</h1>
    <button id="homeBtn" class="btn btn-secondary btn-small">홈으로</button>
  </header>

  <div id="boardCanvas" class="board-canvas">
    <div class="board-canvas-inner-spacer"></div>
  </div>

  <div class="board-toolbar">
    <button id="addStickyBtn" class="btn btn-sticky">+ 내용요소 추가</button>
    <button id="addUnitBtn" class="btn btn-unit">+ 영역명 추가</button>
    <button id="addCategoryBtn" class="btn btn-category">+ 범주추가</button>
    <button id="undoBtn" class="btn btn-secondary" title="실행취소" disabled>↩ 실행취소</button>
    <button id="redoBtn" class="btn btn-secondary" title="되돌리기" disabled>↪ 되돌리기</button>
    <button id="saveBtn" class="btn btn-secondary" title="지금 바로 저장">💾 저장</button>
    <button id="captureBtn" class="btn btn-secondary" title="현재 보드판을 이미지로 저장">📷 사진캡쳐</button>
  </div>

  <footer class="footer board-footer">만든이: 강형권 선생님</footer>

  <div id="leaveConfirmModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>홈으로 나가시겠습니까?</h2>
      <p>홈 화면에서 원하는 보드판을 클릭하고 비밀번호를 입력하면 언제든 다시 들어올 수 있습니다.</p>
      <div class="modal-actions">
        <button id="cancelLeaveBtn" class="btn btn-secondary">취소</button>
        <button id="confirmLeaveBtn" class="btn btn-primary">확인</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/board.js"></script>
</body>
</html>
