<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보드판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="board-body">
  <header class="board-top-bar">
    <h1 id="boardTitle">보드판</h1>
    <a href="index.html" class="btn btn-secondary btn-small">홈으로</a>
  </header>

  <div id="boardCanvas" class="board-canvas">
    <div class="board-canvas-inner-spacer"></div>
  </div>

  <div class="board-toolbar">
    <button id="addStickyBtn" class="btn btn-primary">+ 포스트잇 추가</button>
    <button id="addUnitBtn" class="btn btn-unit">+ 단원명 추가</button>
    <button id="captureBtn" class="btn btn-secondary" title="현재 보드판을 이미지로 저장">📷 사진캡쳐</button>
  </div>

  <footer class="footer board-footer">만든이: 강형권 선생님</footer>

  <script type="module" src="js/board.js"></script>
</body>
</html>
