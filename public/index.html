<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브레인스토밍 협업 보드판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top-bar">
    <h1>브레인스토밍 협업 보드판</h1>
    <button id="createBoardBtn" class="btn btn-primary btn-hero">+ 보드판 만들기</button>
  </header>

  <main class="page-content">
    <div id="boardGrid" class="board-grid">
      <p id="emptyMessage" class="empty-message">아직 만들어진 보드판이 없습니다. 위 버튼을 눌러 새 보드판을 만들어 보세요.</p>
    </div>
  </main>

  <footer class="footer">만든이: 강형권 선생님</footer>

  <!-- 보드판 생성 모달 -->
  <div id="createModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>새 보드판 만들기</h2>
      <label for="schoolNameInput">학교명</label>
      <input type="text" id="schoolNameInput" placeholder="예: 희망초등학교" maxlength="30">
      <label for="schoolPwInput">비밀번호 (숫자 4자리, 비워두면 0000)</label>
      <input type="password" id="schoolPwInput" placeholder="비워두면 0000" maxlength="4" inputmode="numeric" pattern="[0-9]*">
      <p id="createError" class="error-text hidden"></p>
      <div class="modal-actions">
        <button id="cancelCreateBtn" class="btn btn-secondary">취소</button>
        <button id="confirmCreateBtn" class="btn btn-primary">만들기</button>
      </div>
    </div>
  </div>

  <!-- 비밀번호 입력 모달 (입장 / 삭제 공용) -->
  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 id="passwordModalTitle">비밀번호 입력</h2>
      <input type="password" id="passwordInput" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]*">
      <p id="passwordError" class="error-text hidden"></p>
      <div class="modal-actions">
        <button id="cancelPasswordBtn" class="btn btn-secondary">취소</button>
        <button id="confirmPasswordBtn" class="btn btn-primary">확인</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
